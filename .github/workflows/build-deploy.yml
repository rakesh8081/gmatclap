# Builds the site on every push to main and publishes the ready-to-serve files
# (Angular pages + PHP api/) to the `deploy` branch.
# Hostinger auto-deploys the `deploy` branch into public_html.
# If the build fails, nothing is published and the live site stays as it is.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_ENABLED: ${{ secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: List blog posts to pre-render
        run: |
          grep -oP "^\s*slug: '\K[a-z0-9-]+" src/app/blog/blog.data.ts | sed 's#^#/blog/#' > prerender-routes.txt
          cat prerender-routes.txt

      - name: Build Angular (pre-renders every page)
        run: npx ng build --configuration production

      - name: Check PHP files
        run: for f in backend/api/*.php; do php -l "$f"; done

      - name: Assemble public_html
        run: |
          mkdir -p out
          cp -r dist/gmatclap/browser/. out/
          mkdir -p out/api
          cp -r backend/api/. out/api/
          cp deploy/.htaccess out/.htaccess
          test -f out/index.html
          test -f out/enquiry/index.html
          test -f out/results/index.html
          test -f out/free-profile-evaluation/index.html
          test -f out/api/profile.php
          test -f out/blog/index.html
          for r in $(cat prerender-routes.txt); do test -f "out$r/index.html" || { echo "missing pre-rendered $r"; exit 1; }; done
          test -f out/api/enquiry.php
          if grep -rl "localhost:8080/enquiries" out; then echo "Enquiry form still points at localhost"; exit 1; fi
          echo "Files to publish:"; find out -maxdepth 2 | sort | head -80

      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: true
          user_name: github-actions[bot]
          user_email: 41898299+github-actions[bot]@users.noreply.github.com
          commit_message: "Build from ${{ github.sha }}"

      # Upload to Hostinger public_html over FTPS.
      # Needs repo secrets FTP_USERNAME and FTP_PASSWORD (an FTP account whose folder is gmatclap.com/public_html).
      # Only changed files are uploaded. Files this action never uploaded (e.g. anything added by hand) are left alone.
      # Enquiry data lives outside public_html and is never touched.
      - name: Upload to Hostinger
        if: env.FTP_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.gmatclap.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**

      - name: Upload skipped
        if: env.FTP_ENABLED != 'true'
        run: echo "::warning::FTP_USERNAME / FTP_PASSWORD secrets are not set, so the site was built but not uploaded."
