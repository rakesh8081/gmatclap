<app-header></app-header>

<section class="blog-hero">
  <h1>GMATclap Blog</h1>
  <p>GMAT Focus Edition preparation, MBA admissions advice and our students' results.</p>
</section>

<div class="blog-list">
  <article class="post-card" *ngFor="let p of posts">
    <a [href]="'/blog/' + p.slug" class="thumb" *ngIf="p.image" tabindex="-1" aria-hidden="true">
      <img [src]="'assets/' + p.image" alt="" loading="lazy" />
    </a>
    <div class="body">
      <p class="meta">{{ p.date | date: 'd MMMM y' }} · {{ p.author }}</p>
      <h2><a [href]="'/blog/' + p.slug">{{ p.title }}</a></h2>
      <p class="summary">{{ p.summary }}</p>
      <a [href]="'/blog/' + p.slug" class="more">Read more →</a>
    </div>
  </article>
</div>

<app-footer></app-footer>
